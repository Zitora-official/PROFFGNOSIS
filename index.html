<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROFFGNOSIS</title>
    <link rel="stylesheet" href="styles/landing-page-style.css">
</head>

<body>
    <div class="main">
        <header class="header">
            <div class="badge">
                <span class="pulse-dot"></span>
                <span>AI Insights v2.0</span>
            </div>
            <h1 class="title">PROFFGNOSIS</h1>
            <p class="subtitle">Next-gen Academic & Career Predictive Intelligence</p>
        </header>

        <section class="hero-card">
            <div class="stat-number" id="accuracy-counter">0%</div>
            <div class="stat-label">Prediction Accuracy Rate</div>
        </section>

        <section class="features-list">
            <div class="feature-item">
                <div class="feature-icon">⚡</div>
                <div class="feature-info">
                    <h3>Smart Analytics</h3>
                    <p>Real-time performance forecasting</p>
                </div>
            </div>

            <div class="feature-item">
                <div class="feature-icon">🎯</div>
                <div class="feature-info">
                    <h3>Target Tracking</h3>
                    <p>Personalized milestone suggestions</p>
                </div>
            </div>

            <div class="feature-item">
                <div class="feature-icon">🛡️</div>
                <div class="feature-info">
                    <h3>Privacy Protected</h3>
                    <p>End-to-end encrypted metric evaluation</p>
                </div>
            </div>
        </section>

        <footer class="actions">
            <button class="btn-primary" id="getStartedBtn">Get Started</button>
            <button class="btn-secondary" id="demoBtn">Explore Demo</button>
        </footer>
    </div>

    <script src="scripts/landing-page-script.js"></script>
</body>

</html>
